# Jetson deployment: GPU runtime, TensorRT backend, real RTSP cameras.
#
#   docker compose -f docker-compose.jetson.yml up -d
#
# Self-contained — runs with a SINGLE -f (no docker-compose.yml base needed; that
# base only carries mock-mode defaults this file overrides anyway).
#
# Requires the NVIDIA Container Runtime (nvidia-docker) on the Jetson and a
# TensorRT engine built with scripts/export_engine.py (mounted via ./models).
services:
  vision-service:
    build:
      context: ./vision-service
      dockerfile: Dockerfile          # Jetson base image
      args:
        # Pin the floating Jetson base for a release without editing the
        # Dockerfile: resolve the aarch64 digest on the box and export
        # VISION_JETSON_BASE=ultralytics/ultralytics@sha256:<digest> before
        # `docker compose ... build` (see vision-service/Dockerfile header).
        BASE: ${VISION_JETSON_BASE:-ultralytics/ultralytics:latest-jetson-jetpack6}
    image: vision-ai:jetson
    container_name: vision-service-jetson
    runtime: nvidia
    environment:
      VISION_MODE: jetson
      VISION_CAMERA_FORWARD_URL: ${VISION_CAMERA_FORWARD_URL}
      VISION_CAMERA_AFT_URL: ${VISION_CAMERA_AFT_URL}
      VISION_MODEL_ENGINE: yolo11n.engine
    volumes:
      - ./vision-service/models:/opt/vision-service/models
      # Site calibration (horizon_y, height_m, hfov, bearing offsets) lives in
      # config/jetson.yaml; bind-mount read-only so calibration edits take effect
      # on a restart without rebuilding the image (see docs/onboard-verification.md
      # §7), while the container can't rewrite host-side calibration.
      - ./vision-service/config:/opt/vision-service/config:ro
    # Bind to localhost on the boat network; the SignalK plugin proxies it.
    ports:
      - "127.0.0.1:7000:7000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
