# Base compose. By itself this builds the CPU image in mock mode, which is the
# safe default that runs anywhere:
#
#   Mock (no GPU):           docker compose up
#
# The real-deployment compose files are SELF-CONTAINED — each runs with a single
# -f, no base needed:
#
#   Jetson (TensorRT):       docker compose -f docker-compose.jetson.yml up -d
#   Jetson (DeepStream):     docker compose -f docker-compose.deepstream.yml up -d --build
#
# The one exception is the dev full-stack demo, which LAYERS a signalk-server onto
# this base (so it does need both files):
#
#   Dev full stack:          docker compose -f docker-compose.yml -f docker-compose.mock.yml up
#
# The SignalK plugin is installed into a SignalK server separately
# (see docs/dev-quickstart.md); a dev signalk-server is provided in the mock override.
services:
  vision-service:
    build:
      context: ./vision-service
      dockerfile: Dockerfile.cpu
    image: vision-ai:cpu
    environment:
      VISION_MODE: mock
      VISION_PORT: "7000"
      VISION_MOCK_SOURCE: synthetic
    # Bound to localhost by default — the service is unauthenticated, so don't
    # expose it on all interfaces. The SignalK plugin proxies it behind auth.
    ports:
      - "127.0.0.1:7000:7000"
    restart: unless-stopped
