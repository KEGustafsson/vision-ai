# DeepStream GPU pipeline mode
#
# Prerequisites (Jetson Orin Nano, JetPack 6, DeepStream 7.x):
#   sudo apt-get install deepstream-7.1
#   pip install /opt/nvidia/deepstream/deepstream/lib/pyds-*.whl
#
# Build the custom YOLO nvinfer parser once (same .so serves YOLOv8/YOLO11):
#   git clone https://github.com/marcoslucianops/DeepStream-Yolo /tmp/ds-yolo
#   CUDA_VER=$(nvcc --version | grep -oP 'V\K[0-9]+\.[0-9]+') \
#     make -C /tmp/ds-yolo/nvdsinfer_custom_impl_Yolo
#   cp /tmp/ds-yolo/nvdsinfer_custom_impl_Yolo/libnvdsinfer_custom_impl_Yolo.so \
#     vision-service/deepstream/
#
# Export a raw YOLO11n ONNX (no end-to-end NMS — required by deepstream-yolo)
# with the marcoslucianops export script at the SAME size as detector.imgsz:
#   cp /tmp/ds-yolo/utils/export_yolo11.py .
#   python3 export_yolo11.py -w models/yolo11n.pt -s 768 --opset 16 --dynamic --simplify
#   mv yolo11n.onnx deepstream/yolo11n_ds.onnx
#   # nvinfer will auto-build the engine on first run; or pre-build with trtexec:
#   #   trtexec --onnx=deepstream/yolo11n_ds.onnx --fp16 \
#   #           --saveEngine=deepstream/yolo11n_ds.onnx_b2_gpu0_fp16.engine \
#   #           --minShapes=images:1x3x768x768 --optShapes=images:2x3x768x768 \
#   #           --maxShapes=images:2x3x768x768

mode: deepstream

detector:
  backend: deepstream
  # Raw-export engine (see comments above) — NOT the Ultralytics end-to-end engine.
  # (Cosmetic for the deepstream backend: nvinfer takes its ONNX/engine from the
  # pgie config, not from here. Kept in sync for clarity.)
  model_engine: yolo11n_ds.engine
  model_pt: yolo11n.pt
  confidence: 0.35
  track_floor: 0.10
  # Inference resolution. Raised 640 -> 768 to recover pixels on distant/small
  # targets (swimmers, far vessels): the cameras stream 1280x960 and nvinfer
  # down-scales to this square, so a bigger square = more pixels-per-object at
  # range. The Orin Nano GPU sits ~90% idle here so the extra compute is nearly
  # free (RAM is the real budget — 768 is ~1.44x the 640 activation footprint;
  # step to 896/960 only if `nvidia-smi`/tegrastats shows headroom).
  # COUPLING: for the DeepStream backend this value only sets the NvDCF
  # tracker_width (pipeline_deepstream.py). The ACTUAL nvinfer input size is
  # baked into the ONNX at export time, so it MUST be kept in sync with the
  # `-s 768` passed to export_yolo11.py in Dockerfile.deepstream. After changing
  # it, delete any stale *_gpu0_fp16.engine in the mounted deepstream/ dir so
  # nvinfer rebuilds at the new size.
  imgsz: 768
  # Native camera/display/geometry resolution. nvstreammux outputs this size and
  # nvinfer rescales it to imgsz on the GPU for inference. Detection bboxes and
  # horizon_y below are in THIS coordinate space (these domes stream 1280x960).
  mux_width: 1280
  mux_height: 960
  # Short muxer timeout = prompt pushes + better per-camera pipelining (full input
  # rate). The probe's PTS guard drops any frame repeats, so this can't push output
  # above the camera rate. Raise only if you see duplicate-frame churn in the logs.
  mux_batch_timeout_ms: 40
  max_det: 20
  # Stabilizer is still applied in Python on top of nvtracker output.
  # RATE NOTE: frame windows below are wall-clocked at the MEASURED ~6 FPS per
  # camera (2026-07 live measurement), not the 12 FPS target.
  stabilize: true
  stabilize_confirm_frames: 3
  # Base coast window kept short so a young/uncertain track dies fast (~1.3s
  # at ~6 FPS) and never lingers as a phantom false target.
  stabilize_max_coast_frames: 8
  stabilize_hysteresis_ratio: 0.6
  stabilize_ema_alpha: 0.4
  # A PROVEN track (>= stabilize_lock_hits fresh detections) rides out a longer
  # dropout: 8 * 3.0 = 24 frames (~4s at ~6 FPS), so an established vessel
  # occluded by a wave/wake keeps its box while NvDCF still holds its id in
  # shadow. Extended only for locked tracks — not the base window — so the
  # longer hold never applies to unproven tracks.
  stabilize_lock_coast_factor: 3.0
  # Identity retention for idle tracks: how long velocity/display-id/stable_id
  # state survives without a detection. Must cover NvDCF's shadow window
  # (maxShadowTrackingAge = 240 in deepstream/nvdcf_config.yml, ~40s at ~6 FPS)
  # so a shadow-reacquired raw id walks back into its existing ids instead of
  # reblipping the same vessel under a new identity. Default already 260;
  # stated here because it MUST move together with the NvDCF value.
  track_memory_frames: 260
  # Conservative velocity: only 25% of the (already window-averaged) pixel
  # velocity is applied per missed frame, so a coasted box holds near its last
  # position and drifts gently rather than being flung off-target on a stale
  # estimate over the now-longer coast window. Also matters most for a
  # man-overboard target, whose apparent motion is dominated by own-ship drift.
  stabilize_coast_velocity_factor: 0.25
  max_area_frac: 0.4
  contained_frac: 0.8
  # Which detection model to run. Exactly ONE model is active at a time — they
  # are never run together. Switch this value and restart to change models:
  #   coco                -> COCO YOLO11n, 80 classes (person/vessel/buoy/...),
  #                          uses deepstream/pgie_yolo11n.txt + yolo11n_ds.onnx
  #   forward-watch       -> forward-watch marine model, 6 classes
  #                          (ship/boat/debris/buoy/kayak/log),
  #                          uses deepstream/pgie_forward_watch.txt + forward-watch.onnx
  #   marine-surveillance -> Roboflow Marine Surveillance YOLOv8s, 7 classes
  #                          (boat/buoy/kayak/sailboat/speedboat/vessel/warship),
  #                          uses deepstream/pgie_marine_surveillance.txt +
  #                          marine-surveillance.onnx. NO person -> no man-overboard.
  # For forward-watch, fetch + convert the ONNX (the published file is a stock
  # Ultralytics export the parser can't read — yields ZERO detections raw):
  #   python3 scripts/download_forward_watch.py   # downloads AND converts
  # For marine-surveillance, train on-box (Roboflow only exports the dataset):
  #   python3 training/train_marine_surveillance.py --api-key <KEY> ...
  # Override with: VISION_DETECTOR_MODEL=forward-watch
  model: coco
  # NVIDIA Optical Flow Accelerator (OFA), via the DeepStream `nvof` element.
  # OFF by default: enabling it adds an nvof element (plus one in-NVMM colour
  # conversion to NV12) to the batched stream after the tracker, and reports one
  # robust per-camera global image-motion vector in GET /health (optical_flow).
  # It is a MEASUREMENT ONLY — nothing in detection, tracking, geometry,
  # collision logic or the DetectionEvent contract consumes it. See
  # docs/jetson-deepstream.md ("Optical flow (OFA)") for enablement, the jtop
  # check and the sign-convention validation.
  optical_flow: false
  # optical_flow_required: false      # true => /health degrades while flow is
  #                                   # missing/stale and a failing nvof is NOT
  #                                   # silently dropped (default: fail-safe).
  # optical_flow_preset_level: 0      # 0 = fast, 1 = medium (2 is dGPU-only)
  # optical_flow_stale_ms: 2000       # age at which flow is reported stale

cameras:
  - name: forward
    # Override with: VISION_CAMERA_FORWARD_URL=rtsp://user:pass@host/stream
    url: null
    hfov_deg: 96.0
    height_m: 2.5
    horizon_y: 350
    bearing_offset_deg: 0.0
    ptz: true
    undistort: true
    undistort_k1: -0.35
    undistort_rotation_deg: -4.5    # level the bow dome's tilted mount (nvdewarper roll)

  - name: aft
    # Override with: VISION_CAMERA_AFT_URL=rtsp://user:pass@host/stream
    url: null
    hfov_deg: 96.0
    height_m: 4.5
    horizon_y: 220
    bearing_offset_deg: 180.0
    ptz: true
    undistort: true
    undistort_k1: -0.35
    undistort_rotation_deg: 1.0     # level the stern dome's tilted mount (nvdewarper roll)

server:
  target_fps: 12.0
  jpeg_quality: 80
  event_buffer: 200

geometry:
  auto_horizon: false
  # known_widths_m intentionally omitted: the full per-label table in
  # default.yaml applies (one source of truth). Override here only to add deltas.
