# Developer / CI mode: no GPU, no cameras. Synthetic frames + deterministic
# mock detector so the whole pipeline runs on a laptop.
mode: mock
mock_source: synthetic

detector:
  backend: mock

# Synthetic frames render a horizon at 45% of height; declare it so range works.
cameras:
  - name: forward
    hfov_deg: 90.0
    height_m: 2.5
    horizon_y: 324          # 0.45 * 720
    bearing_offset_deg: 0.0
  - name: aft
    hfov_deg: 90.0
    height_m: 2.5
    horizon_y: 324
    bearing_offset_deg: 180.0

server:
  target_fps: 10.0
