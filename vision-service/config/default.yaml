# Base configuration shared by all modes. Mode files override these.
mode: mock
mock_source: synthetic

cameras:
  - name: forward
    hfov_deg: 90.0
    height_m: 2.5
    horizon_y: null        # null => uncalibrated / auto
    bearing_offset_deg: 0.0
  - name: aft
    hfov_deg: 90.0
    height_m: 2.5
    horizon_y: null
    bearing_offset_deg: 180.0

detector:
  backend: mock
  model_pt: yolov8n.pt
  model_engine: yolov8n.engine
  confidence: 0.35
  imgsz: 640
  max_det: 20
  tracker: bytetrack.yaml
  # Drop detections whose bbox exceeds this fraction of the frame (own hull /
  # very-near structure mis-detected as a vessel). 1.0 disables the filter.
  max_area_frac: 0.4
  # Object types to surface (person | vessel | buoy). Omitted/empty => all.
  # The SignalK plugin overrides this at runtime from its admin UI.
  # classes: [person, vessel]

geometry:
  auto_horizon: false
  known_widths_m:
    person: 0.5
    buoy: 0.8
    vessel: 4.0
    kayak: 1.5
    debris: 0.5
    log: 0.3
    # marine-surveillance model (typical beam widths, used for range estimation)
    boat: 3.0
    sailboat: 3.5
    speedboat: 2.5
    warship: 18.0

server:
  host: 0.0.0.0
  port: 7000
  target_fps: 10.0
  jpeg_quality: 80
  event_buffer: 200
