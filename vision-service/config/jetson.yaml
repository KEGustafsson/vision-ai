# Production mode: Jetson Orin Nano. TensorRT backend. Camera URLs come from
# VISION_CAMERA_*_URL env vars. RTSP decode falls back to FFmpeg/TCP when the
# base image's OpenCV lacks GStreamer (see app/camera/__init__.py).
#
# Cameras on Arabella are Hikvision PTZ zoom domes (4x). hfov_deg below is the
# WIDE-end (absoluteZoom=10) datasheet estimate and is ONLY valid while the
# zoom stays wide — zooming in narrows the true HFOV and breaks bearing.
# Validate/refine via the AIS cross-check (docs/onboard-verification.md §4.3).
mode: jetson

detector:
  backend: tensorrt
  model_engine: yolov8n.engine   # dynamic batch 1-2 engine (also kept as yolov8n_b2.engine); note the compose VISION_MODEL_ENGINE env overrides this
  confidence: 0.35
  imgsz: 640
  # Anti-flicker stabilizer, tuned on a 60s capture of live aft/forward tracks
  # (offline replay of the real stabilizer over recorded detections). max_coast
  # is frames of persistence at ~12fps (20 ~= 1.7s): higher = fewer flicker gaps
  # (raw aft had 229) but more phantom-box "tail" after a target leaves, which
  # also feeds CPA. Lower it if stale boxes linger. See memory above.
  stabilize: true
  stabilize_confirm_frames: 3
  stabilize_max_coast_frames: 20
  stabilize_hysteresis_ratio: 0.5
  stabilize_ema_alpha: 0.3
  # Fraction of velocity used while coasting (0 = freeze box, 1 = full predict).
  # Damps a dashed/coasted box so it doesn't drift fast off the object; lower
  # this toward 0 if the predicted box still races ahead.
  stabilize_coast_velocity_factor: 0.4
  # Batch both cameras into one inference. Tried on this Jetson but didn't pay
  # off: the two camera threads rarely align within the rendezvous window (each
  # does variable post-processing after detect), so avg batch ~1.1, and the
  # dynamic engine built under memory pressure is slower per call. Left off; the
  # code path remains for a future synchronized-loop + properly-built engine.
  batch_cameras: false

cameras:
  - name: forward            # bow dome, DS-2DE2A404IW-DE3 (2MP), 192.168.220.21
    url: null                # set via VISION_CAMERA_FORWARD_URL
    hfov_deg: 96.0           # wide-end estimate; refine against AIS
    height_m: 2.5            # TODO[skipper]: measure lens height above waterline
    horizon_y: 350           # TODO[skipper]: pixel row of horizon once aimed level
    bearing_offset_deg: 0.0  # +ve = starboard; adjust for PTZ pan vs bow
    ptz: true                # ONVIF host/creds taken from VISION_CAMERA_FORWARD_URL
    # Display-only lens correction (cosmetic; not used for bearings/range).
    # Eyeballed estimate — replace with checkerboard calibration when available.
    undistort: true
    undistort_k1: -0.35
    undistort_rotation_deg: -4.5
    undistort_before_detect: true   # EXPERIMENT: feed corrected frame to detector
  - name: aft                # stern dome, DS-2DE3304W-DE (3MP), 192.168.220.20
    url: null                # set via VISION_CAMERA_AFT_URL
    hfov_deg: 96.0           # wide-end estimate; refine against AIS
    height_m: 4.5            # TODO[skipper]: measure lens height above waterline
    horizon_y: 220           # TODO[skipper]: pixel row of horizon once aimed level
    bearing_offset_deg: 180.0
    ptz: true                # ONVIF host/creds taken from VISION_CAMERA_AFT_URL
    # Display-only lens correction (cosmetic; not used for bearings/range).
    # Eyeballed estimate — replace with checkerboard calibration when available.
    undistort: true
    undistort_k1: -0.35
    undistort_rotation_deg: 1.0
    undistort_before_detect: true   # EXPERIMENT: feed corrected frame to detector

server:
  target_fps: 12.0
  # Offload JPEG encode to the NVJPG hardware block (nvjpegenc) to take the encode
  # off the CPU. Needs python3-gi in the image (see Dockerfile); falls back to CPU
  # cv2.imencode automatically when unavailable.
  hw_jpeg: true
