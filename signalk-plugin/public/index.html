<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vision-AI — Captain View</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>🛥️ Marine Vision-AI</h1>
      <button id="detToggle" class="det-toggle" type="button" hidden>Detection: —</button>
      <div id="ownship" class="ownship">—</div>
    </header>

    <main>
      <section class="video">
        <div class="cameras" id="cameraButtons"></div>
        <img id="stream" alt="annotated camera stream" />
        <div id="status" class="status">connecting…</div>
        <!-- ONVIF PTZ pad; shown by app.js only for PTZ-capable cameras. -->
        <div class="ptz" id="ptzPad" hidden aria-label="camera control">
          <button class="ptz-up" data-pan="0" data-tilt="1" data-zoom="0" aria-label="tilt up">▲</button>
          <button class="ptz-zin" data-pan="0" data-tilt="0" data-zoom="1" aria-label="zoom in">＋</button>
          <button class="ptz-left" data-pan="-1" data-tilt="0" data-zoom="0" aria-label="pan left">◄</button>
          <button class="ptz-home" data-home="1" aria-label="home position">⌂</button>
          <button class="ptz-right" data-pan="1" data-tilt="0" data-zoom="0" aria-label="pan right">►</button>
          <button class="ptz-down" data-pan="0" data-tilt="-1" data-zoom="0" aria-label="tilt down">▼</button>
          <button class="ptz-zout" data-pan="0" data-tilt="0" data-zoom="-1" aria-label="zoom out">－</button>
        </div>
      </section>

      <section class="targets">
        <h2>Targets <span id="targetCount" class="badge">0</span></h2>
        <table>
          <thead>
            <tr>
              <th>Label</th><th>Brg</th><th>Rng</th><th>CPA</th><th>TCPA</th><th>AIS</th><th>Threat</th>
            </tr>
          </thead>
          <tbody id="targetRows"></tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
