# DeepStream deployment: GPU decode + inference + tracking via NVIDIA DeepStream.
#
#   docker compose -f docker-compose.deepstream.yml up -d --build
#
# This file is self-contained — it defines the whole vision-service for this path,
# so it runs with a SINGLE -f (no docker-compose.yml base needed; that base only
# carries mock-mode defaults DeepStream overrides anyway).
#
# This is the "more on GPU than main" path. Unlike the jetson deployment (TensorRT +
# CPU decode/track), here the whole pipeline runs on the GPU (see
# app/pipeline_deepstream.py). It needs the NVIDIA Container Runtime and a
# DeepStream-capable image (built from vision-service/Dockerfile.deepstream).
#
# Camera URLs come from .env (same keys as the jetson override). The first start
# is slow: nvinfer builds the TensorRT engine from deepstream/yolov8n_ds.onnx into
# the bind-mounted models/ dir — give the board free RAM for that build (the engine
# then persists, so later starts are fast).
services:
  vision-service:
    build:
      context: ./vision-service
      dockerfile: Dockerfile.deepstream
      args:
        # Stage-1 export base. Defaults (in the Dockerfile) to the public
        # Ultralytics Jetson image, so this builds from a clean clone in one
        # command. Pin a digest for a reproducible release the same way as the
        # jetson override: resolve the aarch64 digest on the box and export
        # VISION_JETSON_BASE=ultralytics/ultralytics@sha256:<digest>.
        EXPORT_BASE: ${VISION_JETSON_BASE:-ultralytics/ultralytics:latest-jetson-jetpack6}
    image: vision-ai:deepstream
    container_name: vision-service-deepstream
    restart: unless-stopped
    runtime: nvidia
    environment:
      VISION_MODE: deepstream
      VISION_CAMERA_FORWARD_URL: ${VISION_CAMERA_FORWARD_URL}
      VISION_CAMERA_AFT_URL: ${VISION_CAMERA_AFT_URL}
    volumes:
      # Site calibration (horizon_y, height_m, hfov, bearing offsets) lives in
      # config/deepstream.yaml; bind-mount read-only so edits take effect on a
      # restart but a compromised container can't rewrite host-side calibration.
      - ./vision-service/config:/opt/vision-service/config:ro
      # Application code: bind-mount read-only so Python edits (pipeline/detector/
      # geometry) take effect on a plain `restart` (no rebuild) while a compromised
      # container can't tamper with the host source the host runs. The image still
      # bakes a copy, so it also runs standalone without this mount.
      - ./vision-service/app:/opt/vision-service/app:ro
      # DeepStream assets: pgie configs, labels, the deepstream-yolo ONNX/parser
      # .so, AND the TensorRT engine. nvinfer writes the built engine into THIS
      # dir (model-engine-file is relative to the pgie config), so mounting it
      # persists the engine across image rebuilds/recreates — avoiding a costly
      # (RAM-tight) TRT rebuild. The default COCO ONNX (gitignored, so absent from
      # a fresh clone) is seeded here automatically on first start by the image's
      # entrypoint, so a from-scratch build needs no hand-placed model. For an
      # ALTERNATIVE model the host dir must hold its ONNX (forward-watch /
      # marine-surveillance — see docs/jetson-setup.md).
      - ./vision-service/deepstream:/opt/vision-service/deepstream
      # TensorRT-backend engines for the jetson (non-deepstream) path; harmless
      # here, kept so switching VISION_MODE doesn't lose the cached engine.
      - ./vision-service/models:/opt/vision-service/models
    # Bind to localhost on the boat network; the SignalK plugin proxies it.
    ports:
      - "127.0.0.1:7000:7000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
