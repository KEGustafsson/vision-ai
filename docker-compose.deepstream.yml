# DeepStream override: GPU decode + inference + tracking via NVIDIA DeepStream.
#
#   docker compose -f docker-compose.yml -f docker-compose.deepstream.yml up -d
#
# This is the "more on GPU than main" path. Unlike the jetson override (TensorRT +
# CPU decode/track), here the whole pipeline runs on the GPU (see
# app/pipeline_deepstream.py). It needs the NVIDIA Container Runtime and a
# DeepStream-capable image (built from vision-service/Dockerfile.deepstream).
#
# Camera URLs come from .env (same keys as the jetson override). The first start
# is slow: nvinfer builds the TensorRT engine from deepstream/yolov8n_ds.onnx into
# the bind-mounted models/ dir — give the board free RAM for that build (the engine
# then persists, so later starts are fast).
services:
  vision-service:
    build:
      context: ./vision-service
      dockerfile: Dockerfile.deepstream
    image: vision-ai:deepstream
    container_name: vision-service-deepstream
    restart: unless-stopped
    runtime: nvidia
    environment:
      VISION_MODE: deepstream
      VISION_CAMERA_FORWARD_URL: ${VISION_CAMERA_FORWARD_URL}
      VISION_CAMERA_AFT_URL: ${VISION_CAMERA_AFT_URL}
    volumes:
      # Site calibration (horizon_y, height_m, hfov, bearing offsets) lives in
      # config/deepstream.yaml; bind-mount so edits take effect on restart.
      - ./vision-service/config:/opt/vision-service/config
      # Application code: bind-mount so Python edits (pipeline/detector/geometry)
      # take effect on a plain `restart`, no image rebuild needed. The image still
      # bakes a copy, so the container also runs standalone without this mount.
      - ./vision-service/app:/opt/vision-service/app
      # DeepStream assets: pgie configs, labels, the deepstream-yolo ONNX/parser
      # .so, AND the TensorRT engine. nvinfer writes the built engine into THIS
      # dir (model-engine-file is relative to the pgie config), so mounting it
      # persists the engine across image rebuilds/recreates — avoiding a costly
      # (RAM-tight) TRT rebuild. Host dir must hold every file the active model
      # needs (the *.onnx are gitignored but present on the box).
      - ./vision-service/deepstream:/opt/vision-service/deepstream
      # TensorRT-backend engines for the jetson (non-deepstream) path; harmless
      # here, kept so switching VISION_MODE doesn't lose the cached engine.
      - ./vision-service/models:/opt/vision-service/models
    # Bind to localhost on the boat network; the SignalK plugin proxies it.
    ports:
      - "127.0.0.1:7000:7000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
