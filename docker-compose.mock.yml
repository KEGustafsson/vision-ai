# Mock vision service, built from this checkout, for the Signal K server you
# already run. Synthetic forward and aft cameras, no GPU and no cameras needed:
#
#   docker compose -f docker-compose.mock.yml up -d --build
#
# Self-contained, like the other compose files: a single -f, no base needed.
# Install the plugin into your Signal K server (App Store, or link
# ./signalk-plugin into ~/.signalk/node_modules for development) and leave its
# "Vision container base URL" at http://localhost:7000. See
# docs/dev-quickstart.md.
#
# The aft camera's made-up person in the water raises a REAL notifications.mob
# alarm in that Signal K server. Use a test server, never one on a boat under way.
#
# To run the published mock image instead of building, use
# deploy/docker-compose.mock.yml.
services:
  vision-service:
    build:
      context: ./vision-service
      dockerfile: Dockerfile.cpu
    image: vision-ai:cpu
    container_name: vision-service-mock
    environment:
      VISION_MODE: mock
      VISION_PORT: "7000"
      VISION_MOCK_SOURCE: synthetic
    volumes:
      # Drop a clip here and set VISION_MOCK_SOURCE=/samples/clip.mp4 to use video.
      - ./vision-service/samples:/samples:ro
    # Unauthenticated service: localhost only. The plugin proxies it behind
    # Signal K's login.
    ports:
      - "127.0.0.1:7000:7000"
    restart: unless-stopped
