name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # release.yml runs the whole suite on the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  vision-service:
    name: vision-service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # -c constraints.txt pins the FastAPI/Starlette/httpx stack to the
          # verified versions so a clean install can't drift onto an untested
          # Starlette/httpx combo and break test collection (see constraints.txt).
          pip install -c constraints.txt -r requirements.txt pytest httpx
      - name: Run tests
        run: pytest
      - name: Verify detection-event schema is up to date
        run: |
          python scripts/export_schema.py
          if ! git diff --exit-code ../signalk-plugin/schema/detection-event.schema.json; then
            echo "::error::detection-event.schema.json is stale — run scripts/export_schema.py and commit."
            exit 1
          fi

  signalk-plugin:
    name: signalk-plugin (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signalk-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: signalk-plugin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc)
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  compose:
    name: compose / Dockerfile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catch a malformed compose file or a base override that no longer parses
      # before it reaches a (RAM-tight, slow-to-build) Jetson. `config` fully
      # resolves and validates each compose stack without building or pulling.
      - name: Validate compose stacks
        run: |
          # Production paths are self-contained — validate them the way they're
          # run: a single -f, no base. (Each redefines the whole vision-service.)
          for stack in docker-compose.jetson.yml docker-compose.deepstream.yml \
                       docker-compose.deepstream.xavier.yml; do
            echo "::group::$stack (standalone)"
            docker compose -f "$stack" config -q
            echo "::endgroup::"
          done
          # The mock stack and the base are self-contained too.
          for stack in docker-compose.mock.yml docker-compose.yml; do
            echo "::group::$stack (standalone)"
            docker compose -f "$stack" config -q
            echo "::endgroup::"
          done
          # The release compose files in deploy/ pull the published images.
          # They refuse to start without both camera addresses, so give them
          # placeholders for validation.
          for stack in deploy/docker-compose.*.yml; do
            echo "::group::$stack"
            VISION_CAMERA_FORWARD_URL=rtsp://ci.invalid/forward \
            VISION_CAMERA_AFT_URL=rtsp://ci.invalid/aft \
              docker compose -f "$stack" config -q
            echo "::endgroup::"
          done
      # NB: a Dockerfile linter (hadolint) was intentionally NOT added here — its
      # parser rejects the valid BuildKit heredoc (`python3 - <<'PY'`) used in
      # vision-service/Dockerfile, which would fail the build on syntax it doesn't
      # support. `docker compose config` above already validates that every stack
      # parses and references its Dockerfiles correctly.
