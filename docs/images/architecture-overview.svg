<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="820" height="470" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">System architecture</text>

  <!-- cameras -->
  <g>
    <rect x="30" y="120" width="150" height="54" rx="8" fill="#e2e8f0" stroke="#475569"/>
    <text x="105" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">fwd camera</text>
    <rect x="30" y="196" width="150" height="54" rx="8" fill="#e2e8f0" stroke="#475569"/>
    <text x="105" y="228" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">aft camera</text>
  </g>

  <!-- vision service -->
  <rect x="270" y="90" width="240" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="390" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">vision-service (Python)</text>
  <text x="390" y="146" text-anchor="middle" font-size="12.5" fill="#1e40af">YOLO detector + tracker</text>
  <text x="390" y="166" text-anchor="middle" font-size="12.5" fill="#1e40af">+ monocular geometry</text>
  <text x="390" y="186" text-anchor="middle" font-size="12.5" fill="#1e40af">(bearing / range)</text>

  <!-- plugin -->
  <rect x="270" y="270" width="240" height="120" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="390" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">signalk-vision-ai plugin (TS)</text>
  <text x="390" y="326" text-anchor="middle" font-size="12.5" fill="#047857">enrich &#183; AIS fusion &#183; CPA/TCPA</text>
  <text x="390" y="346" text-anchor="middle" font-size="12.5" fill="#047857">notifications &#183; publisher</text>

  <!-- signalk -->
  <rect x="600" y="270" width="195" height="120" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="697" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">SignalK server</text>
  <text x="697" y="336" text-anchor="middle" font-size="12.5" fill="#6d28d9">&#8594; MFD / chart</text>
  <text x="697" y="356" text-anchor="middle" font-size="12.5" fill="#6d28d9">&#8594; Captain view</text>

  <!-- camera -> vision (RTSP) -->
  <line x1="180" y1="147" x2="268" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="180" y1="223" x2="268" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="224" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">RTSP</text>

  <!-- vision -> plugin -->
  <line x1="350" y1="210" x2="350" y2="268" stroke="#1d4ed8" stroke-width="2" marker-end="url(#b)"/>
  <text x="345" y="244" text-anchor="end" font-size="11" fill="#1d4ed8">WebSocket events</text>
  <line x1="430" y1="268" x2="430" y2="210" stroke="#1d4ed8" stroke-width="2" marker-end="url(#b)"/>
  <text x="437" y="244" text-anchor="start" font-size="11" fill="#1d4ed8">REST control</text>
  <!-- mjpeg -->
  <line x1="390" y1="210" x2="390" y2="268" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="390" y="240" text-anchor="middle" font-size="10" fill="#64748b">MJPEG</text>

  <!-- plugin -> signalk -->
  <line x1="510" y1="330" x2="598" y2="330" stroke="#7c3aed" stroke-width="2" marker-end="url(#c)"/>
  <text x="554" y="322" text-anchor="middle" font-size="11" fill="#7c3aed">vision.* deltas</text>
  <text x="554" y="350" text-anchor="middle" font-size="11" fill="#7c3aed">notifications.*</text>

  <!-- contract note -->
  <rect x="270" y="412" width="525" height="40" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="532" y="430" text-anchor="middle" font-size="12" fill="#92400e">Two processes, one contract: the container owns GPU/pixels/geometry and emits a single</text>
  <text x="532" y="446" text-anchor="middle" font-size="12" fill="#92400e">JSON schema; the plugin owns all navigation-relative math. The two sides can't drift.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/></marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
