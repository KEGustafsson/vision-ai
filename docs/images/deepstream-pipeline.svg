<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="940" height="380" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">DeepStream pipeline &#8212; fully GPU-resident (NVMM)</text>

  <!-- NVMM band -->
  <rect x="20" y="58" width="900" height="244" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-dasharray="7 5"/>
  <text x="38" y="80" font-size="12.5" font-weight="700" fill="#047857">Frames stay in NVMM end to end &#8212; the CPU only ever sees the finished JPEG bytes</text>

  <!-- batched stage label -->
  <text x="38" y="104" font-size="11" font-weight="600" fill="#0369a1">Batched (both cameras via nvstreammux)</text>

  <!-- row 1 boxes -->
  <g font-size="11">
    <rect x="40" y="114" width="120" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="100" y="138" text-anchor="middle" font-weight="600" fill="#1e3a8a">rtspsrc</text>
    <text x="100" y="153" text-anchor="middle" fill="#1e40af" font-size="10">2 cameras</text>

    <rect x="186" y="114" width="120" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="246" y="138" text-anchor="middle" font-weight="600" fill="#1e3a8a">nvv4l2decoder</text>
    <text x="246" y="153" text-anchor="middle" fill="#1e40af" font-size="10">HW decode</text>

    <rect x="332" y="114" width="120" height="50" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-dasharray="4 3"/>
    <text x="392" y="138" text-anchor="middle" font-weight="600" fill="#3730a3">nvdewarper</text>
    <text x="392" y="153" text-anchor="middle" fill="#4338ca" font-size="10">lens correction</text>

    <rect x="478" y="114" width="120" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="538" y="138" text-anchor="middle" font-weight="600" fill="#1e3a8a">nvstreammux</text>
    <text x="538" y="153" text-anchor="middle" fill="#1e40af" font-size="10">batch</text>

    <rect x="624" y="114" width="120" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="684" y="138" text-anchor="middle" font-weight="600" fill="#1e3a8a">nvinfer</text>
    <text x="684" y="153" text-anchor="middle" fill="#1e40af" font-size="10">TensorRT</text>

    <rect x="770" y="114" width="130" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="835" y="138" text-anchor="middle" font-weight="600" fill="#1e3a8a">nvtracker</text>
    <text x="835" y="153" text-anchor="middle" fill="#1e40af" font-size="10">NvDCF</text>
  </g>
  <g stroke="#1d4ed8" stroke-width="1.8" fill="none" marker-end="url(#ds)">
    <line x1="160" y1="139" x2="184" y2="139"/>
    <line x1="306" y1="139" x2="330" y2="139"/>
    <line x1="452" y1="139" x2="476" y2="139"/>
    <line x1="598" y1="139" x2="622" y2="139"/>
    <line x1="744" y1="139" x2="768" y2="139"/>
  </g>

  <!-- U-turn down -->
  <path d="M 835 164 L 835 188 L 100 188 L 100 210" stroke="#1d4ed8" stroke-width="1.8" fill="none" marker-end="url(#ds)"/>

  <!-- per-camera stage label -->
  <text x="38" y="206" font-size="11" font-weight="600" fill="#0369a1">Per camera (after nvstreamdemux)</text>

  <!-- row 2 boxes -->
  <g font-size="11">
    <rect x="40" y="216" width="130" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="105" y="240" text-anchor="middle" font-weight="600" fill="#1e3a8a">nvvideoconvert</text>
    <text x="105" y="255" text-anchor="middle" fill="#1e40af" font-size="10">RGBA</text>

    <rect x="196" y="216" width="120" height="50" rx="6" fill="#fef9c3" stroke="#eab308"/>
    <text x="256" y="240" text-anchor="middle" font-weight="600" fill="#854d0e">pad probe</text>
    <text x="256" y="255" text-anchor="middle" fill="#854d0e" font-size="10">read meta only</text>

    <rect x="342" y="216" width="130" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="407" y="240" text-anchor="middle" font-weight="600" fill="#1e3a8a">nvstreamdemux</text>

    <rect x="498" y="216" width="110" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="553" y="240" text-anchor="middle" font-weight="600" fill="#1e3a8a">nvdsosd</text>
    <text x="553" y="255" text-anchor="middle" fill="#1e40af" font-size="10">GPU overlay</text>

    <rect x="634" y="216" width="120" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="694" y="240" text-anchor="middle" font-weight="600" fill="#1e3a8a">nvjpegenc</text>
    <text x="694" y="255" text-anchor="middle" fill="#1e40af" font-size="10">I420 &#8594; JPEG</text>

    <rect x="780" y="216" width="120" height="50" rx="6" fill="#d1fae5" stroke="#059669"/>
    <text x="840" y="240" text-anchor="middle" font-weight="600" fill="#065f46">appsink</text>
    <text x="840" y="255" text-anchor="middle" fill="#047857" font-size="10">&#8594; LatestFrame</text>
  </g>
  <g stroke="#1d4ed8" stroke-width="1.8" fill="none" marker-end="url(#ds)">
    <line x1="170" y1="241" x2="194" y2="241"/>
    <line x1="316" y1="241" x2="340" y2="241"/>
    <line x1="472" y1="241" x2="496" y2="241"/>
    <line x1="608" y1="241" x2="632" y2="241"/>
    <line x1="754" y1="241" x2="778" y2="241"/>
  </g>

  <text x="470" y="296" text-anchor="middle" font-size="11.5" fill="#475569">[ dashed = optional ]&#160;&#160;nvdewarper applies barrel + rotation on the GPU before inference</text>
  <text x="470" y="330" text-anchor="middle" font-size="12" fill="#047857">Detection metadata also feeds bearing/range geometry &#8594; DetectionEvent (host side, no pixel copy)</text>

  <defs>
    <marker id="ds" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/></marker>
  </defs>
</svg>
