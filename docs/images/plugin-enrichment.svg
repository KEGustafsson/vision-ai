<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Plugin-side enrichment of each DetectionEvent</text>

  <!-- incoming -->
  <rect x="300" y="56" width="220" height="44" rx="7" fill="#bfdbfe" stroke="#1d4ed8"/>
  <text x="410" y="83" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">DetectionEvent (per frame)</text>

  <!-- steps -->
  <g>
    <rect x="120" y="124" width="580" height="46" rx="7" fill="#d1fae5" stroke="#059669"/>
    <text x="135" y="143" font-size="13" font-weight="700" fill="#065f46">enrichTarget()</text>
    <text x="135" y="161" font-size="11.5" fill="#047857">relative bearing + own heading &#8594; true bearing &#183; own position + bearing + range &#8594; target lat/lon</text>
  </g>
  <g>
    <rect x="120" y="190" width="580" height="46" rx="7" fill="#d1fae5" stroke="#059669"/>
    <text x="135" y="209" font-size="13" font-weight="700" fill="#065f46">collectAisContacts()</text>
    <text x="135" y="227" font-size="11.5" fill="#047857">enumerate vessels.* with positions</text>
  </g>
  <g>
    <rect x="120" y="256" width="580" height="46" rx="7" fill="#d1fae5" stroke="#059669"/>
    <text x="135" y="275" font-size="13" font-weight="700" fill="#065f46">fuse()</text>
    <text x="135" y="293" font-size="11.5" fill="#047857">correlate visual vs AIS &#8594; aisCorrelated | darkTarget</text>
  </g>
  <g>
    <rect x="120" y="322" width="580" height="46" rx="7" fill="#d1fae5" stroke="#059669"/>
    <text x="135" y="341" font-size="13" font-weight="700" fill="#065f46">CpaEstimator.update()</text>
    <text x="135" y="359" font-size="11.5" fill="#047857">per-track ground velocity &#8594; CPA / TCPA &#8594; threatLevel</text>
  </g>

  <!-- outputs -->
  <rect x="120" y="388" width="280" height="34" rx="7" fill="#fee2e2" stroke="#dc2626"/>
  <text x="260" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">NotificationManager &#8212; MOB / dark / collision</text>
  <rect x="420" y="388" width="280" height="34" rx="7" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="560" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">Publisher &#8212; vessels.* + vision.*</text>

  <!-- arrows -->
  <g stroke="#047857" stroke-width="2" fill="none" marker-end="url(#pe)">
    <line x1="410" y1="100" x2="410" y2="122"/>
    <line x1="410" y1="170" x2="410" y2="188"/>
    <line x1="410" y1="236" x2="410" y2="254"/>
    <line x1="410" y1="302" x2="410" y2="320"/>
    <line x1="260" y1="368" x2="260" y2="386"/>
    <line x1="560" y1="368" x2="560" y2="386"/>
  </g>

  <defs>
    <marker id="pe" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#047857"/></marker>
  </defs>
</svg>
