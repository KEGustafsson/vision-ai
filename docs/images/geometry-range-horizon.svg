<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="780" height="500" fill="#ffffff"/>
  <text x="390" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Range by horizon depression — side view</text>
  <text x="390" y="52" text-anchor="middle" font-size="13" fill="#475569">The angle an object's waterline sits below the horizon gives its distance</text>

  <!-- sky -->
  <rect x="60" y="70" width="660" height="250" fill="#e0f2fe"/>
  <!-- sea -->
  <rect x="60" y="320" width="660" height="120" fill="#bae6fd"/>
  <line x1="60" y1="320" x2="720" y2="320" stroke="#0284c7" stroke-width="2"/>
  <text x="690" y="338" text-anchor="end" font-size="12" fill="#0369a1">water surface</text>

  <!-- horizon line (camera eye level) -->
  <line x1="120" y1="130" x2="700" y2="130" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="700" y="124" text-anchor="end" font-size="12" fill="#475569">horizon (eye-level reference, row horizon_y)</text>

  <!-- camera height h -->
  <line x1="120" y1="130" x2="120" y2="320" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="116" y1="130" x2="124" y2="130" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="116" y1="320" x2="124" y2="320" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="110" y="228" text-anchor="end" font-size="14" font-weight="600" fill="#7c3aed">h</text>
  <text x="110" y="246" text-anchor="end" font-size="11" fill="#7c3aed">camera height</text>

  <!-- ray to object waterline -->
  <line x1="120" y1="130" x2="560" y2="320" stroke="#dc2626" stroke-width="2"/>

  <!-- depression angle arc -->
  <path d="M 230 130 A 110 110 0 0 0 222 165" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="245" y="158" font-size="14" font-weight="700" fill="#b45309">&#952;</text>
  <text x="250" y="178" font-size="11" fill="#b45309">depression</text>

  <!-- range distance along water -->
  <line x1="120" y1="360" x2="560" y2="360" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="120" y1="354" x2="120" y2="366" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="560" y1="354" x2="560" y2="366" stroke="#0f766e" stroke-width="1.5"/>
  <text x="340" y="380" text-anchor="middle" font-size="14" font-weight="600" fill="#0f766e">range = h / tan(&#952;)</text>

  <!-- object boat -->
  <g transform="translate(560,320)">
    <path d="M -20 0 L 20 0 L 13 13 L -13 13 Z" fill="#0f172a"/>
    <rect x="-3" y="-16" width="4" height="16" fill="#0f172a"/>
    <path d="M 1 -16 L 14 -6 L 1 -6 Z" fill="#dc2626"/>
  </g>
  <text x="560" y="356" text-anchor="middle" font-size="12" fill="#0f172a">detected vessel</text>

  <!-- camera -->
  <g transform="translate(120,130)">
    <rect x="-26" y="-12" width="30" height="24" rx="3" fill="#1e293b"/>
    <circle cx="-11" cy="0" r="7" fill="#38bdf8"/>
    <rect x="4" y="-4" width="10" height="8" fill="#1e293b"/>
  </g>
  <text x="120" y="108" text-anchor="middle" font-size="12" fill="#0f172a">camera</text>

  <!-- sensor inset: rows -->
  <rect x="600" y="150" width="150" height="150" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="675" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">image rows</text>
  <line x1="610" y1="200" x2="740" y2="200" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="612" y="196" font-size="10" fill="#475569">horizon_y</text>
  <line x1="610" y1="270" x2="740" y2="270" stroke="#dc2626" stroke-width="1.5"/>
  <text x="612" y="266" font-size="10" fill="#dc2626">object_y (bbox bottom)</text>
  <line x1="730" y1="200" x2="730" y2="270" stroke="#b45309" stroke-width="1.5"/>
  <line x1="726" y1="200" x2="734" y2="200" stroke="#b45309" stroke-width="1.5"/>
  <line x1="726" y1="270" x2="734" y2="270" stroke="#b45309" stroke-width="1.5"/>
  <text x="722" y="240" text-anchor="end" font-size="10" fill="#b45309">&#916;rows</text>

  <!-- formula block -->
  <rect x="70" y="452" width="640" height="40" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="390" y="470" text-anchor="middle" font-size="12.5" fill="#92400e" font-family="monospace">VFOV = 2&#183;atan(tan(HFOV/2)&#183;H/W)   IFOV = VFOV/H   &#952; = (object_y &#8722; horizon_y)&#183;IFOV</text>
  <text x="390" y="487" text-anchor="middle" font-size="12.5" fill="#92400e" font-family="monospace">range = h / tan(&#952;)        confidence &#8595; as &#952; &#8594; 0 (object near horizon)</text>
</svg>
