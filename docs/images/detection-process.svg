<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="560" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">From pixels to georeferenced, alerting targets</text>
  <text x="460" y="54" text-anchor="middle" font-size="13" fill="#475569">The full process: detect &#8594; measure bearing &amp; range &#8594; georeference &#8594; fuse with AIS &#8594; alert</text>

  <!-- container lane background -->
  <rect x="20" y="78" width="880" height="150" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="34" y="98" font-size="13" font-weight="700" fill="#1d4ed8">vision-service (container) &#183; GPU, pixels, monocular geometry</text>

  <!-- plugin lane background -->
  <rect x="20" y="330" width="880" height="150" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="34" y="350" font-size="13" font-weight="700" fill="#047857">signalk-plugin &#183; live nav state, fusion, alerts</text>

  <!-- container boxes -->
  <g>
    <rect x="36" y="112" width="150" height="100" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="111" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Camera frame</text>
    <text x="111" y="170" text-anchor="middle" font-size="11.5" fill="#1e40af">RTSP decode</text>
    <text x="111" y="187" text-anchor="middle" font-size="11.5" fill="#1e40af">(fwd / aft)</text>
  </g>
  <g>
    <rect x="208" y="112" width="150" height="100" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="283" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Detect + track</text>
    <text x="283" y="168" text-anchor="middle" font-size="11.5" fill="#1e40af">YOLO + tracker</text>
    <text x="283" y="185" text-anchor="middle" font-size="11.5" fill="#1e40af">&#8594; bbox, track_id</text>
  </g>
  <g>
    <rect x="380" y="112" width="150" height="100" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="455" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Bearing</text>
    <text x="455" y="168" text-anchor="middle" font-size="11.5" fill="#1e40af">pixel column</text>
    <text x="455" y="185" text-anchor="middle" font-size="11.5" fill="#1e40af">&#8594; angle off axis</text>
  </g>
  <g>
    <rect x="552" y="112" width="150" height="100" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="627" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Range</text>
    <text x="627" y="165" text-anchor="middle" font-size="11.5" fill="#1e40af">horizon depression</text>
    <text x="627" y="182" text-anchor="middle" font-size="11.5" fill="#1e40af">or known size</text>
    <text x="627" y="199" text-anchor="middle" font-size="11.5" fill="#1e40af">+ confidence</text>
  </g>
  <g>
    <rect x="724" y="112" width="160" height="100" rx="8" fill="#bfdbfe" stroke="#1d4ed8"/>
    <text x="804" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Operator filters</text>
    <text x="804" y="165" text-anchor="middle" font-size="11.5" fill="#1e40af">classes, min range</text>
    <text x="804" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">DetectionEvent</text>
  </g>

  <!-- container arrows -->
  <g stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ab)">
    <line x1="186" y1="162" x2="206" y2="162"/>
    <line x1="358" y1="162" x2="378" y2="162"/>
    <line x1="530" y1="162" x2="550" y2="162"/>
    <line x1="702" y1="162" x2="722" y2="162"/>
  </g>

  <!-- boundary -->
  <rect x="724" y="232" width="160" height="68" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="804" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">DetectionEvent JSON</text>
  <text x="804" y="276" text-anchor="middle" font-size="11" fill="#854d0e">WebSocket &#183; SI at</text>
  <text x="804" y="291" text-anchor="middle" font-size="11" fill="#854d0e">the boundary</text>
  <line x1="804" y1="212" x2="804" y2="230" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>

  <!-- plugin boxes -->
  <g>
    <rect x="724" y="364" width="160" height="100" rx="8" fill="#d1fae5" stroke="#059669"/>
    <text x="804" y="396" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">enrich</text>
    <text x="804" y="416" text-anchor="middle" font-size="11.5" fill="#047857">+ heading &#8594; true bearing</text>
    <text x="804" y="433" text-anchor="middle" font-size="11.5" fill="#047857">+ position + range</text>
    <text x="804" y="450" text-anchor="middle" font-size="11.5" fill="#047857">&#8594; target lat/lon</text>
  </g>
  <g>
    <rect x="552" y="364" width="150" height="100" rx="8" fill="#d1fae5" stroke="#059669"/>
    <text x="627" y="400" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">AIS fusion</text>
    <text x="627" y="420" text-anchor="middle" font-size="11.5" fill="#047857">correlate visual</text>
    <text x="627" y="437" text-anchor="middle" font-size="11.5" fill="#047857">&#8594; matched / dark</text>
  </g>
  <g>
    <rect x="380" y="364" width="150" height="100" rx="8" fill="#d1fae5" stroke="#059669"/>
    <text x="455" y="400" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">CPA / TCPA</text>
    <text x="455" y="420" text-anchor="middle" font-size="11.5" fill="#047857">per-track velocity</text>
    <text x="455" y="437" text-anchor="middle" font-size="11.5" fill="#047857">&#8594; threat level</text>
  </g>
  <g>
    <rect x="208" y="364" width="150" height="100" rx="8" fill="#d1fae5" stroke="#059669"/>
    <text x="283" y="396" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Notifications</text>
    <text x="283" y="416" text-anchor="middle" font-size="11.5" fill="#047857">MOB &#183; collision</text>
    <text x="283" y="433" text-anchor="middle" font-size="11.5" fill="#047857">dark target</text>
  </g>
  <g>
    <rect x="36" y="364" width="150" height="100" rx="8" fill="#a7f3d0" stroke="#047857"/>
    <text x="111" y="396" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Publish</text>
    <text x="111" y="416" text-anchor="middle" font-size="11.5" fill="#047857">synthetic AIS</text>
    <text x="111" y="433" text-anchor="middle" font-size="11.5" fill="#047857">vessels.* +</text>
    <text x="111" y="450" text-anchor="middle" font-size="11.5" fill="#047857">vision.* paths</text>
  </g>

  <!-- plugin arrows (right to left) -->
  <g stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ag)">
    <line x1="722" y1="414" x2="704" y2="414"/>
    <line x1="550" y1="414" x2="532" y2="414"/>
    <line x1="378" y1="414" x2="360" y2="414"/>
    <line x1="206" y1="414" x2="188" y2="414"/>
  </g>

  <!-- to SignalK -->
  <line x1="111" y1="464" x2="111" y2="500" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/>
  <text x="130" y="492" font-size="12" font-weight="600" fill="#065f46">&#8594; SignalK server &#183; MFD / chart &#183; Captain view</text>

  <defs>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#047857"/></marker>
  </defs>
</svg>
