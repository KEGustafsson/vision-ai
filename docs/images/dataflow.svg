<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="860" height="340" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Container data flow</text>
  <text x="430" y="50" text-anchor="middle" font-size="12.5" fill="#475569">One inference loop fans out to two never-blocking ring buffers</text>

  <!-- main chain -->
  <g font-size="11.5">
    <rect x="20" y="80" width="120" height="56" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <text x="80" y="104" text-anchor="middle" font-weight="600" fill="#1e3a8a">camera</text>
    <text x="80" y="122" text-anchor="middle" fill="#1e40af">FrameSource.read()</text>

    <rect x="180" y="80" width="150" height="56" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <text x="255" y="104" text-anchor="middle" font-weight="600" fill="#1e3a8a">Detector</text>
    <text x="255" y="122" text-anchor="middle" fill="#1e40af">detect_and_track()</text>

    <rect x="370" y="80" width="150" height="56" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <text x="445" y="104" text-anchor="middle" font-weight="600" fill="#1e3a8a">geometry</text>
    <text x="445" y="122" text-anchor="middle" fill="#1e40af">bearing + range</text>

    <rect x="560" y="80" width="160" height="56" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <text x="640" y="104" text-anchor="middle" font-weight="600" fill="#1e3a8a">operator filters</text>
    <text x="640" y="122" text-anchor="middle" fill="#1e40af">classes, min range</text>
  </g>

  <!-- arrows in chain -->
  <g stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#d)">
    <line x1="140" y1="108" x2="178" y2="108"/>
    <line x1="330" y1="108" x2="368" y2="108"/>
    <line x1="520" y1="108" x2="558" y2="108"/>
  </g>
  <text x="159" y="74" text-anchor="middle" font-size="10" fill="#64748b">RawTrack[]</text>

  <!-- DetectionEvent node -->
  <rect x="610" y="180" width="160" height="50" rx="7" fill="#bfdbfe" stroke="#1d4ed8"/>
  <text x="690" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">DetectionEvent</text>
  <line x1="660" y1="136" x2="675" y2="178" stroke="#1d4ed8" stroke-width="2" marker-end="url(#d)"/>

  <!-- fan out -->
  <rect x="320" y="260" width="200" height="56" rx="7" fill="#fef9c3" stroke="#eab308"/>
  <text x="420" y="284" text-anchor="middle" font-size="12.5" font-weight="600" fill="#854d0e">EventBuffer</text>
  <text x="420" y="302" text-anchor="middle" font-size="11" fill="#854d0e">&#8594; WebSocket</text>

  <rect x="560" y="260" width="240" height="56" rx="7" fill="#fef9c3" stroke="#eab308"/>
  <text x="680" y="284" text-anchor="middle" font-size="12.5" font-weight="600" fill="#854d0e">annotate() &#8594; LatestFrame</text>
  <text x="680" y="302" text-anchor="middle" font-size="11" fill="#854d0e">&#8594; MJPEG</text>

  <line x1="650" y1="230" x2="470" y2="258" stroke="#ca8a04" stroke-width="2" marker-end="url(#e)"/>
  <line x1="700" y1="230" x2="690" y2="258" stroke="#ca8a04" stroke-width="2" marker-end="url(#e)"/>
  <text x="40" y="284" font-size="11.5" fill="#475569">Slow MJPEG / WS clients read</text>
  <text x="40" y="301" font-size="11.5" fill="#475569">from the buffers &#8212; they can</text>
  <text x="40" y="318" font-size="11.5" fill="#475569">never stall the camera loop.</text>

  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/></marker>
    <marker id="e" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ca8a04"/></marker>
  </defs>
</svg>
